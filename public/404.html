<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // 
    // This script takes the current url and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new url with only a query string and hash fragment
    
    var l = window.location;
    var basePath = '/shadcn-ui';
    
    // Get the full pathname
    var pathname = l.pathname;
    
    // Remove base path from pathname
    var routePath = '';
    if (pathname.startsWith(basePath)) {
      routePath = pathname.substring(basePath.length);
    } else {
      // If base path not found, use the whole pathname (shouldn't happen but just in case)
      routePath = pathname;
    }
    
    // Ensure routePath starts with / if it's not empty
    if (routePath && !routePath.startsWith('/')) {
      routePath = '/' + routePath;
    }
    
    // Remove leading slash for the redirect (we'll add it back in the query)
    routePath = routePath.replace(/^\/+/, '');
    
    // Filter out empty segments and index.html
    var pathSegments = routePath.split('/').filter(function(segment) {
      return segment !== '' && segment !== 'index.html';
    });
    
    // Build redirect URL
    var redirectUrl = basePath + '/?/' + pathSegments.join('/').replace(/&/g, '~and~');
    
    // Add original query string if present (but skip if it's the redirect query)
    if (l.search && !l.search.startsWith('?/')) {
      redirectUrl += '&' + l.search.slice(1).replace(/&/g, '~and~');
    }
    
    // Add hash if present
    if (l.hash) {
      redirectUrl += l.hash;
    }
    
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <noscript>
    <p>This site requires JavaScript to be enabled.</p>
  </noscript>
</body>
</html>
