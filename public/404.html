<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    
    // This script takes the current url and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new url with only a query string and hash fragment,
    // e.g., https://www.foo.com/path/to/thing?foo=bar#hash becomes
    // https://www.foo.com/?/path/to/thing&foo=bar#hash
    
    (function() {
      var pathSegmentsToKeep = 1; // Number of path segments to keep (shadcn-ui)
      
      var l = window.location;
      var basePath = '/shadcn-ui'; // Your GitHub Pages base path
      
      // Get the path without the base
      var path = l.pathname;
      var pathSegments = path.split('/').filter(function(seg) { return seg; });
      
      // Keep only segments after the base path
      var pathToKeep = pathSegments.slice(pathSegmentsToKeep).join('/');
      
      // Build new URL
      var newPath = basePath + '/?/' + pathToKeep.replace(/&/g, '~and~');
      if (l.search) {
        newPath += '&' + l.search.slice(1).replace(/&/g, '~and~');
      }
      newPath += l.hash;
      
      l.replace(newPath);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
