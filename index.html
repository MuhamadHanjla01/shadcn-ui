<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Prevent mobile browser caching - force fresh data on refresh -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <link rel="icon" href="https://public-frontend-cos.metadl.com/mgx/img/favicon.png" type="image/png">
  <title>Muhamad Hanjla</title>
  
  <!-- Immediately load settings and user data to update OG tags for social media scrapers -->
  <script>
    (function() {
      try {
        // Function to update meta tags
        function updateMetaTag(selector, content) {
          if (!content) return;
          let tag = document.querySelector(selector);
          if (tag) {
            tag.setAttribute('content', content);
          } else {
            try {
              if (selector.includes('property=')) {
                const match = selector.match(/property="([^"]+)"/);
                if (match && match[1]) {
                  const property = match[1];
                  tag = document.createElement('meta');
                  tag.setAttribute('property', property);
                  document.head.appendChild(tag);
                  tag.setAttribute('content', content);
                }
              } else if (selector.includes('name=')) {
                const match = selector.match(/name="([^"]+)"/);
                if (match && match[1]) {
                  const name = match[1];
                  tag = document.createElement('meta');
                  tag.setAttribute('name', name);
                  document.head.appendChild(tag);
                  tag.setAttribute('content', content);
                }
              }
            } catch (e) {
              console.warn('Error creating meta tag:', e);
            }
          }
        }
        
        // Try to fetch user data from JSON file first (for accurate social previews)
        const basePath = '/shadcn-ui';
        const userDataUrl = basePath + '/data/user.json?v=' + Date.now();
        const siteSettingsUrl = basePath + '/data/site-settings.json?v=' + Date.now();
        
        // Fetch from backend API instead of localStorage
        const backendUrl = window.location.hostname === 'localhost' 
          ? 'http://localhost:3001' 
          : 'https://shadcn-ui-production-8f2d.up.railway.app';
        
        // Try to fetch fresh data from backend API
        let parsedUser = null;
        let parsedSettings = {};
        
        // Try to fetch fresh data from backend API (async)
        Promise.all([
          fetch(backendUrl + '/api/data/user', { cache: 'no-store' }).catch(() => null),
          fetch(backendUrl + '/api/data/site-settings', { cache: 'no-store' }).catch(() => null)
        ]).then(async ([userResponse, settingsResponse]) => {
          if (userResponse && userResponse.ok) {
            try {
              const result = await userResponse.json();
              if (result.success && result.data) {
                parsedUser = result.data;
              }
            } catch (e) {
              console.warn('Error parsing user data:', e);
            }
          }
          
          if (settingsResponse && settingsResponse.ok) {
            try {
              const result = await settingsResponse.json();
              if (result.success && result.data) {
                parsedSettings = result.data;
              }
            } catch (e) {
              console.warn('Error parsing settings data:', e);
            }
          }
          
          // Always update OG tags with whatever data we have
          updateOGTags(parsedUser, parsedSettings);
        }).catch((error) => {
          console.warn('Error fetching backend data:', error);
          // Still update with whatever we have
          updateOGTags(parsedUser, parsedSettings);
        });
        
        // Update OG tags with backend data when available
        function updateOGTags(parsedUser, parsedSettings) {
          // Build dynamic meta data
          let ogTitle, ogDescription, ogImage;
          
          if (parsedSettings && parsedSettings.metaTitle) {
            ogTitle = parsedSettings.metaTitle;
            document.title = parsedSettings.metaTitle;
          } else if (parsedUser && parsedUser.name && parsedUser.title) {
            ogTitle = parsedUser.name + ' - ' + parsedUser.title;
            document.title = ogTitle;
          }
          
          if (parsedSettings && parsedSettings.metaDescription) {
            ogDescription = parsedSettings.metaDescription;
          } else if (parsedUser) {
            ogDescription = (parsedUser.tagline || parsedUser.name + ' - ' + parsedUser.title + ' Portfolio');
          }
          
          // Priority: custom OG image > user profile image
          if (parsedSettings && parsedSettings.ogImage) {
            ogImage = parsedSettings.ogImage;
          } else if (parsedUser && parsedUser.profileImage) {
            ogImage = parsedUser.profileImage;
          }
          
          // Convert relative URLs to absolute for social media crawlers
          if (ogImage && !ogImage.startsWith('http') && !ogImage.startsWith('data:')) {
            ogImage = window.location.origin + (ogImage.startsWith('/') ? ogImage : '/' + ogImage);
          }
          
          // Update OG tags immediately
          if (ogTitle) {
            updateMetaTag('meta[property="og:title"]', ogTitle);
            updateMetaTag('meta[name="twitter:title"]', ogTitle);
          }
          
          if (ogDescription) {
            updateMetaTag('meta[property="og:description"]', ogDescription);
            updateMetaTag('meta[name="twitter:description"]', ogDescription);
            updateMetaTag('meta[name="description"]', ogDescription);
          }
          
          if (ogImage) {
            updateMetaTag('meta[property="og:image"]', ogImage);
            updateMetaTag('meta[property="og:image:secure_url"]', ogImage);
            updateMetaTag('meta[property="og:image:type"]', 'image/jpeg');
            updateMetaTag('meta[property="og:image:width"]', '1200');
            updateMetaTag('meta[property="og:image:height"]', '630');
            updateMetaTag('meta[name="twitter:image"]', ogImage);
          }
          
          // Update OG URL
          updateMetaTag('meta[property="og:url"]', window.location.href);
          
          // Update OG site name
          if (parsedSettings && parsedSettings.siteName) {
            updateMetaTag('meta[property="og:site_name"]', parsedSettings.siteName);
          } else if (parsedUser && parsedUser.name) {
            updateMetaTag('meta[property="og:site_name"]', parsedUser.name);
          }
          
          // Ensure og:type is set
          updateMetaTag('meta[property="og:type"]', 'website');
        }
        
        // Helper to update favicon
        function updateFavicon(faviconUrl) {
          const existingIcon = document.querySelector("link[rel*='icon']");
          if (existingIcon) {
            existingIcon.setAttribute('href', faviconUrl);
            existingIcon.setAttribute('type', 'image/x-icon');
          } else {
            const newIcon = document.createElement('link');
            newIcon.rel = 'icon';
            newIcon.type = 'image/x-icon';
            newIcon.href = faviconUrl;
            document.head.appendChild(newIcon);
          }
        }
        
        // No longer update immediately - wait for backend data
        
        // Update title and other settings if available
        if (parsedSettings && parsedSettings.metaTitle) {
          document.title = parsedSettings.metaTitle;
        }
      } catch (e) {
        // Silently fail - React will handle it
        console.error('Error loading initial site settings:', e);
      }
    })();
  </script>
  
  <meta name="description" content="Full Stack Developer specializing in React, Node.js, and modern web technologies. View my portfolio, projects, and get in touch." />
  <meta name="author" content="Alex Chen" />
  <meta name="keywords" content="Full Stack Developer, React, Node.js, TypeScript, Web Development, Portfolio" />

  <!-- Open Graph tags - Will be dynamically updated by MetadataManager -->
  <meta property="og:title" content="Portfolio - Full Stack Developer" />
  <meta property="og:description" content="Professional portfolio showcasing projects, skills, and experience" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://public-frontend-cos.metadl.com/mgx/img/favicon.png" />
  <meta property="og:image:secure_url" content="https://public-frontend-cos.metadl.com/mgx/img/favicon.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://muhamadhanjla01.github.io/shadcn-ui/" />
  <meta property="og:site_name" content="Portfolio" />

  <!-- Twitter Card tags - Will be dynamically updated by MetadataManager -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Portfolio - Full Stack Developer" />
  <meta name="twitter:description" content="Professional portfolio showcasing projects, skills, and experience" />
  <meta name="twitter:image" content="https://public-frontend-cos.metadl.com/mgx/img/favicon.png" />
  <meta name="twitter:site" content="@portfolio" />
  <meta name="twitter:creator" content="@portfolio" />

  <!-- Single Page Apps for GitHub Pages -->
  <!-- This script checks for a redirect and restores the original URL -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        
        // Handle base path correctly for GitHub Pages
        var basePath = '/shadcn-ui';
        var restoredPath = basePath + decoded;
        
        window.history.replaceState(null, null, restoredPath + l.hash);
      }
    }(window.location))
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
