  <!-- Immediately load settings and user data from localStorage to update OG tags for social media scrapers -->
  <script>
    (function() {
      try {
        // Load site settings
        const settings = localStorage.getItem('portfolio_site_settings');
        const parsedSettings = settings ? JSON.parse(settings) : {};
        
        // Load user data
        const userData = localStorage.getItem('portfolio_user_data');
        const parsedUser = userData ? JSON.parse(userData) : null;
        
        // Build dynamic meta data
        let ogTitle, ogDescription, ogImage;
        
        if (parsedSettings.metaTitle) {
          ogTitle = parsedSettings.metaTitle;
          document.title = parsedSettings.metaTitle;
        } else if (parsedUser) {
          ogTitle = parsedUser.name + ' - ' + parsedUser.title;
          document.title = ogTitle;
        }
        
        if (parsedSettings.metaDescription) {
          ogDescription = parsedSettings.metaDescription;
        } else if (parsedUser) {
          ogDescription = parsedUser.tagline || parsedUser.name + ' - ' + parsedUser.title + ' Portfolio';
        }
        
        if (parsedSettings.ogImage) {
          ogImage = parsedSettings.ogImage;
        } else if (parsedUser && parsedUser.profileImage) {
          ogImage = parsedUser.profileImage;
          // Convert relative URLs to absolute
          if (!ogImage.startsWith('http') && !ogImage.startsWith('data:')) {
            ogImage = window.location.origin + (ogImage.startsWith('/') ? ogImage : '/' + ogImage);
          }
        }
        
        // Update OG tags immediately (before React loads)
        function updateMetaTag(selector, content) {
          if (!content) return;
          let tag = document.querySelector(selector);
          if (tag) {
            tag.setAttribute('content', content);
          } else {
            // Create if doesn't exist
            if (selector.includes('property=')) {
              const property = selector.match(/property="([^"]+)"/)[1];
              tag = document.createElement('meta');
              tag.setAttribute('property', property);
              document.head.appendChild(tag);
              tag.setAttribute('content', content);
            } else if (selector.includes('name=')) {
              const name = selector.match(/name="([^"]+)"/)[1];
              tag = document.createElement('meta');
              tag.setAttribute('name', name);
              document.head.appendChild(tag);
              tag.setAttribute('content', content);
            }
          }
        }
        
        if (ogTitle) {
          updateMetaTag('meta[property="og:title"]', ogTitle);
          updateMetaTag('meta[name="twitter:title"]', ogTitle);
        }
        
        if (ogDescription) {
          updateMetaTag('meta[property="og:description"]', ogDescription);
          updateMetaTag('meta[name="twitter:description"]', ogDescription);
          updateMetaTag('meta[name="description"]', ogDescription);
        }
        
        if (ogImage) {
          updateMetaTag('meta[property="og:image"]', ogImage);
          updateMetaTag('meta[name="twitter:image"]', ogImage);
        }
        
        // Update OG URL
        updateMetaTag('meta[property="og:url"]', window.location.href);
        
        // Update OG site name
        if (parsedSettings.siteName || parsedUser?.name) {
          updateMetaTag('meta[property="og:site_name"]', parsedSettings.siteName || parsedUser.name);
        }
        
        // Update title if not set from settings
        if (parsedSettings.metaTitle) {
          document.title = parsedSettings.metaTitle;
          
          // Generate favicon from text
          function generateTextFavicon(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            if (!ctx) return '';
            
            // Background
            ctx.fillStyle = '#2563eb'; // blue-600
            ctx.fillRect(0, 0, 64, 64);
            
            // Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 32, 32);
            
            return canvas.toDataURL('image/png');
          }

          // Update favicon using theme logo (image or text mode)
          var faviconUrl = '';
          if (parsed.logoMode === 'text' && parsed.logoText) {
            // Generate favicon from text
            faviconUrl = generateTextFavicon(parsed.logoText);
          } else if (parsed.logo) {
            // Use image logo
            faviconUrl = parsed.logo;
          }
          
          if (faviconUrl) {
            const existingIcon = document.querySelector("link[rel*='icon']");
            if (existingIcon) {
              existingIcon.setAttribute('href', faviconUrl);
              existingIcon.setAttribute('type', 'image/x-icon');
            } else {
              const newIcon = document.createElement('link');
              newIcon.rel = 'icon';
              newIcon.type = 'image/x-icon';
              newIcon.href = faviconUrl;
              document.head.appendChild(newIcon);
            }
          }
          
          // Update meta description
          if (parsed.metaDescription) {
            let metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
              metaDesc.setAttribute('content', parsed.metaDescription);
            } else {
              metaDesc = document.createElement('meta');
              metaDesc.name = 'description';
              metaDesc.content = parsed.metaDescription;
              document.head.appendChild(metaDesc);
            }
          }
          
          // Update meta keywords
          if (parsed.metaKeywords) {
            let metaKeys = document.querySelector('meta[name="keywords"]');
            if (metaKeys) {
              metaKeys.setAttribute('content', parsed.metaKeywords);
            } else {
              metaKeys = document.createElement('meta');
              metaKeys.name = 'keywords';
              metaKeys.content = parsed.metaKeywords;
              document.head.appendChild(metaKeys);
            }
          }
        }
      } catch (e) {
        // Silently fail - React will handle it
        console.error('Error loading initial site settings:', e);
      }
    })();
  </script>

  <!-- This script checks for a redirect and restores the original URL -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        
        // Handle base path correctly for GitHub Pages
        var basePath = '/shadcn-ui';
        var restoredPath = basePath + decoded;
        
        window.history.replaceState(null, null, restoredPath + l.hash);
      }
    }(window.location))
  </script>
